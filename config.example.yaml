# ==============================================================================
# μVNC Relay (MicroVNC Relay) Configuration
# Lightweight TCP relay + VNC repeater with WebUI — VNC-first, generic TCP-capable.
# Mode 1 is generic TCP (VNC, RDP, SSH, SMB/tcp, HTTP). Mode 2 / noVNC are VNC-only.
# Non-goals: no UDP relay, no load balancing, no TLS termination (delegate outward
# to NetBird/WireGuard, HAProxy/nginx, reverse proxy).
# ==============================================================================

# ==============================================================================
# Feature Toggles (Tune modules to run ultra-lean on constrained SBCs)
# ==============================================================================
features:
  # Web management dashboard & REST API
  # Set to false to run in "Headless Pure Relay" mode (~6MB - 10MB RAM)
  webui_enabled: true

  # Interactive visual network topology map (SVG/Canvas node graph)
  # Set to false to use plain table view and save browser/client rendering
  topology_map_enabled: true

  # In-browser noVNC HTML5 viewer and WebSocket-to-TCP bridge (/ws/vnc/*)
  # Disable if you only use native desktop VNC clients to save WebSocket buffers
  novnc_enabled: true

  # Mode 1: Generic TCP port-forwarding (virtual_port -> host:port)
  # Works for any TCP: VNC 5900, RDP 3389, SSH 22, SMB 445/tcp, HTTP 80.
  # TCP-only, no UDP. Pure byte-stream, no protocol decoding.
  mode1_enabled: true

  # Mode 2: UltraVNC reverse ID matchmaker, VNC-only (ports 5500 & 5901)
  # Target VNC servers dial out with "ID:xxxx"; viewers pair by the same ID.
  # Disable if all your machines use direct port mappings
  mode2_enabled: true

  # Background latency probes (periodic TCP SYN handshakes to target machines)
  # Disable to eliminate background polling timers entirely
  latency_probes_enabled: true

  # Live bandwidth metering (atomic RX/TX throughput counters)
  bandwidth_metering_enabled: true

# ==============================================================================
# Network & Listener Bindings
# ==============================================================================
server:
  # Dedicated file for target definitions (defaults to "targets.yaml" in same dir)
  # Keeping targets in targets.yaml allows modifying devices via WebUI or CLI
  # without ever touching or risking corruption of your daemon config.
  # Reload targets on the fly: microvnc-relay --reload (or systemctl reload)
  targets_file: "targets.yaml"

  # WebUI & API listener (Ignored if features.webui_enabled is false)
  # Bind to "0.0.0.0:8080" for all interfaces, or NetBird IP (e.g. "100.64.0.1:8080")
  # NetBird relay recipe: use the wt0 address only so the dashboard never hits WAN.
  web_bind: "0.0.0.0:8080"

  # Base listener IP for Mode 1 generic TCP listeners (despite the legacy key name)
  # Use "0.0.0.0" for LAN, or NetBird wt0 IP (e.g. "100.64.0.1") for mesh-only relay.
  vnc_bind: "0.0.0.0"

  # Ports for Mode 2 UltraVNC reverse connections, VNC-only (target servers dial in here)
  mode2_reverse_port: 5500

  # Mode 2 viewer port where clients specify ID:<codeplate>
  mode2_viewer_port: 5901

# ==============================================================================
# Authentication & Security
# ==============================================================================
security:
  # Protect WebUI with session authentication (Recommended: true)
  # On first launch with auth_enabled: true, the relay prints a one-time setup
  # token to stdout/journal. The WebUI setup form requires that token before it
  # will create administrator credentials (bcrypt, written to auth.json).
  # Read it with: journalctl -u microvnc-relay | docker logs <container>
  # To reset: stop the service, delete auth.json, start the service, and use the
  # newly printed token. There is no default username or password.
  auth_enabled: true

  # Session timeout in minutes
  session_timeout_minutes: 1440

  # Set the Secure attribute on session cookies. Enable when the WebUI is
  # reached over HTTPS (reverse proxy or overlay TLS); leave false for
  # plain-HTTP overlay/localhost deployments.
  secure_cookies: false

# ==============================================================================
# Access Control & Subnet Whitelist
# ==============================================================================
access_control:
  # Restrict incoming connections to specific subnets (CIDR notation)
  # Connections from unlisted subnets are rejected immediately at TCP handshake
  # NetBird relay recipe: enabled: true + ["100.64.0.0/10"] for mesh-only access.
  enabled: false
  allowed_subnets:
    - "100.64.0.0/10"   # NetBird Mesh Overlay
    - "192.168.0.0/16"  # Local LAN (e.g. 192.168.1.x)
    - "10.0.0.0/8"      # Private Network
    - "127.0.0.1/32"    # Loopback

# ==============================================================================
# Connection Timeouts & QoS Bandwidth Limits
# ==============================================================================
connection_limits:
  # TCP keepalive interval to detect and terminate zombie/dropped connections
  tcp_keepalive_sec: 30

  # Connect timeout when probing or establishing link to target TCP servers
  dial_timeout_sec: 5

  # Maximum time to complete the Mode 2 UltraVNC "ID:xxxx" handshake
  # (reverse port 5500 + viewer port 5901). Stalled scanners / slowloris
  # clients are disconnected after this deadline. Requires full restart.
  mode2_handshake_timeout_sec: 5

  # Idle timeout in seconds before closing inactive client sockets (0 = disabled)
  idle_timeout_sec: 0

  # Optional per-session bandwidth cap in KB/s to prevent network choking (0 = unlimited)
  max_session_kbps: 0

# ==============================================================================
# Logging & Storage (Flash Wear Protection)
# ==============================================================================
logging:
  # Set to true ONLY if you require persistent disk logs
  # Default is false: logs stay in a RAM ring buffer to preserve MicroSD / eMMC flash
  disk_logging: false
  log_level: "info" # debug, info, warn, error
  log_file: "/var/log/microvnc-relay/app.log"
  max_size_mb: 5
  max_backups: 2
  in_memory_buffer_lines: 500

# ==============================================================================
# Telemetry Timers
# ==============================================================================
telemetry:
  # Real-time metrics broadcast interval over WebSocket to WebUI (seconds)
  broadcast_interval_sec: 1
  # Latency probe frequency to targets (seconds)
  target_ping_interval_sec: 15

# ==============================================================================
# Registered Targets (VNC or generic TCP)
# NOTE: In the dual-file configuration, targets are loaded from `targets.yaml`
# (see `targets.example.yaml`). When targets.yaml exists, it takes precedence.
# The inline `devices:` block below is preserved for backward compatibility
# and single-file deployments.
#
# Mode 1: virtual_port -> host:port works for any TCP (VNC 5900, RDP 3389,
# SSH 22, SMB 445/tcp). mode2_id / vnc_server_type are VNC-only.
# TCP-only: no UDP, no load balancing (1:1 mapping), no TLS termination.
# ==============================================================================
devices:
  - id: "pi2-lab"
    name: "Raspberry Pi 2 (Workbench)"
    host: "192.168.1.50"
    port: 5900
    virtual_port: 5910      # Clients connect via <relay-ip>:5910
    mode2_id: 1234          # Optional UltraVNC Mode 2 ID
    vnc_server_type: "x11vnc"
    enabled: true

  - id: "armbian-tvbox"
    name: "Orange Pi / Armbian Box"
    host: "192.168.1.51"
    port: 5901
    virtual_port: 5911      # Clients connect via <relay-ip>:5911
    mode2_id: 1235
    vnc_server_type: "tightvnc"
    enabled: true

  - id: "desktop-pc"
    name: "Workstation Main Desktop"
    host: "192.168.1.52"
    port: 5900
    virtual_port: 5912
    vnc_server_type: "realvnc"
    enabled: true

  # Generic TCP examples (uncomment to use; keep virtual_port unique):
  # - id: "office-rdp"
  #   name: "Office PC RDP"
  #   host: "192.168.1.60"
  #   port: 3389          # RDP over TCP; RDP-UDP boost not relayed (TCP-only)
  #   virtual_port: 5920  # Clients connect via <relay-ip>:5920
  #   enabled: true
  # - id: "nas-ssh"
  #   name: "NAS SSH"
  #   host: "192.168.1.61"
  #   port: 22
  #   virtual_port: 5921
  #   enabled: true
